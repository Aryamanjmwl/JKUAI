name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENABLE_DEMO_ROLES: "true"
      RUN_INTEGRATION: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: retrieval-models-minilm-v1
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[cpu,dev]"
      - name: Start PostgreSQL and OpenSearch
        run: |
          sudo sysctl -w vm.max_map_count=262144
          docker compose up -d --wait --wait-timeout 180
      - run: alembic upgrade head
      - name: Warm local models
        run: python -c "from app.services.ml import embed_texts, rerank; embed_texts(['warmup']); rerank('warmup', [{'content':'warmup'}], 1)"
      - name: Start API
        run: |
          uvicorn app.main:app --app-dir backend > /tmp/jkuai-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 1
          done
          cat /tmp/jkuai-api.log
          exit 1
      - run: python scripts/demo.py --check
      - run: pytest -q tests/integration
      - name: Capture service logs
        if: always()
        run: |
          docker compose logs --no-color > /tmp/jkuai-services.log
          cat /tmp/jkuai-api.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence
          path: |
            data/demo-output/report.json
            /tmp/jkuai-api.log
            /tmp/jkuai-services.log
      - run: docker compose down
        if: always()
