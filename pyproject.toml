[project]
name = "jku-knowledge-search"
version = "0.1.0"
description = "Permission-aware hybrid enterprise search and RAG for university documents"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "openai>=1.100,<3",
  "opensearch-py>=2.8,<4",
  "pgvector>=0.4,<1",
  "pydantic-settings>=2.10,<3",
  "pypdf>=5.9,<7",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

cpu = [
  "sentence-transformers>=5.0,<6",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
